      <script>
        // Apply dark mode immediately before React loads to prevent FOUC
        // Defaults to browser's system preference, only uses localStorage if user explicitly set it
        (function() {
          let stored = null;
          try { stored = localStorage.getItem('theme'); } catch { /* Storage may be unavailable. */ }
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          // Only use stored preference if it exists (user has manually toggled)
          // Otherwise default to system preference
          const isDark = stored === 'dark' || (stored !== 'light' && prefersDark);
          
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        })();
      </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
